name: Sync wiki

# Sync wiki/ to the initialized GitHub Wiki on relevant main pushes or manually.

on:
  push:
    branches: [main]
    paths: ['wiki/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Push wiki/ to GitHub wiki
        uses: Andrew-Chen-Wang/github-wiki-action@v5
        with:
          path: wiki/
          token: ${{ secrets.GITHUB_TOKEN }}
