name: Build & Release

on:
  push:
    tags: ['v*']
  # PRs run tests and web checks; cargo-graph changes also smoke-test ARM.
  pull_request:
    branches: [main, main-dev]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  plan_build:
    name: Plan ARM builds
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      run_build: ${{ steps.plan.outputs.run_build }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0

      # Select before matrix expansion; job-level gates cannot read `matrix`.
      # Tags/manual runs use every slice. Cargo-changing PRs smoke-test the
      # native a53 and cross-compiled armv7 paths.
      # The runtime picker maps CPU variants from /proc/cpuinfo:
      #   * a76 → Pi 5 (Cortex-A76, ARMv8.2 with LSE atomics)
      #   * a72 → Pi 4, Radxa ROCK 4C+ perf cluster (Cortex-A72)
      #   * a53 → Pi 3, Pi Zero 2 W, Allwinner H618 boards (Cortex-A53)
      # BCM2710/2711 lack LLVM's assumed ARMv8 crypto, so a53/a72 must strip
      # AES/SHA or RustCrypto can SIGILL (issue #88). BCM2712/a76 supports it.
      - name: Select build matrix
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          all_matrix=$(jq -c . <<'JSON'
            {
              "include": [
                {
                  "name": "ARM64 a53 (Pi 3 / Pi Zero 2 W / Allwinner H618)",
                  "runs_on": "ubuntu-22.04-arm",
                  "target": "aarch64-unknown-linux-gnu",
                  "cpu": "cortex-a53",
                  "cpu_features": "-C target-feature=-aes,-sha2",
                  "linker": "cc",
                  "gcc": "",
                  "artifact_suffix": "linux-arm64-a53",
                  "smoke_on_pr": true
                },
                {
                  "name": "ARM64 a72 (Pi 4 / Radxa ROCK 4C+)",
                  "runs_on": "ubuntu-22.04-arm",
                  "target": "aarch64-unknown-linux-gnu",
                  "cpu": "cortex-a72",
                  "cpu_features": "-C target-feature=-aes,-sha2",
                  "linker": "cc",
                  "gcc": "",
                  "artifact_suffix": "linux-arm64-a72",
                  "smoke_on_pr": false
                },
                {
                  "name": "ARM64 a76 (Pi 5)",
                  "runs_on": "ubuntu-22.04-arm",
                  "target": "aarch64-unknown-linux-gnu",
                  "cpu": "cortex-a76",
                  "cpu_features": "",
                  "linker": "cc",
                  "gcc": "",
                  "artifact_suffix": "linux-arm64-a76",
                  "smoke_on_pr": false
                },
                {
                  "name": "ARMv7 (Pi 2/3/Zero2W 32-bit)",
                  "runs_on": "ubuntu-22.04",
                  "target": "armv7-unknown-linux-gnueabihf",
                  "cpu": "cortex-a7",
                  "cpu_features": "",
                  "linker": "arm-linux-gnueabihf-gcc",
                  "gcc": "gcc-arm-linux-gnueabihf",
                  "artifact_suffix": "linux-armv7",
                  "smoke_on_pr": true
                }
              ]
            }
          JSON
          )

          run_build=true
          selected=$all_matrix

          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            selected=$(jq -c '{include: [.include[] | select(.smoke_on_pr)]}' <<<"$all_matrix")
            # Preserve git-diff errors; only exit 1 means relevant changes.
            if git diff --quiet "$BASE_SHA...$HEAD_SHA" -- \
                Cargo.lock Cargo.toml \
                ':(glob)**/Cargo.lock' ':(glob)**/Cargo.toml'
            then
              run_build=false
            else
              diff_exit=$?
              if [ "$diff_exit" -ne 1 ]; then
                exit "$diff_exit"
              fi
            fi
          fi

          echo "run_build=$run_build" >> "$GITHUB_OUTPUT"
          echo "matrix=$selected" >> "$GITHUB_OUTPUT"
          echo "run_build=$run_build"
          jq -r '.include[] | "selected: \(.name)"' <<<"$selected"

  build:
    name: Build ${{ matrix.name }}
    # plan_build supplies the selected slices and cargo-path gate.
    needs: plan_build
    if: needs.plan_build.outputs.run_build == 'true'
    # Ubuntu 22.04 keeps binaries within Bookworm's glibc 2.36 ABI. Build
    # aarch64 natively; cross-compile armv7 on x86 with target libdbus.
    runs-on: ${{ matrix.runs_on }}
    strategy:
      matrix: ${{ fromJSON(needs.plan_build.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install build dependencies
        run: |
          # Native aarch64 uses host libraries; armv7 needs ports.ubuntu.com,
          # cross GCC, and target-architecture libdbus headers.
          case "${{ matrix.target }}" in
            aarch64-*)
              sudo apt-get update -qq
              sudo apt-get install -y -qq \
                brotli mold pkg-config libdbus-1-dev
              ;;
            armv7-*|arm-*)
              UBUNTU_CODENAME=$(lsb_release -cs)
              echo "Ubuntu codename: $UBUNTU_CODENAME"
              # Replace runner sources to avoid conflicting architecture filters.
              sudo rm -f /etc/apt/sources.list.d/ubuntu.sources
              sudo tee /etc/apt/sources.list >/dev/null <<EOF
          deb [arch=amd64,i386] http://archive.ubuntu.com/ubuntu/ ${UBUNTU_CODENAME} main restricted universe multiverse
          deb [arch=amd64,i386] http://archive.ubuntu.com/ubuntu/ ${UBUNTU_CODENAME}-updates main restricted universe multiverse
          deb [arch=amd64,i386] http://archive.ubuntu.com/ubuntu/ ${UBUNTU_CODENAME}-backports main restricted universe multiverse
          deb [arch=amd64,i386] http://security.ubuntu.com/ubuntu/ ${UBUNTU_CODENAME}-security main restricted universe multiverse
          EOF
              sudo tee /etc/apt/sources.list.d/ports.list >/dev/null <<EOF
          deb [arch=arm64,armhf] http://ports.ubuntu.com/ubuntu-ports/ ${UBUNTU_CODENAME} main restricted universe multiverse
          deb [arch=arm64,armhf] http://ports.ubuntu.com/ubuntu-ports/ ${UBUNTU_CODENAME}-updates main restricted universe multiverse
          deb [arch=arm64,armhf] http://ports.ubuntu.com/ubuntu-ports/ ${UBUNTU_CODENAME}-security main restricted universe multiverse
          EOF
              sudo dpkg --add-architecture armhf
              sudo apt-get update -qq
              sudo apt-get install -y -qq \
                ${{ matrix.gcc }} brotli mold pkg-config \
                libdbus-1-dev libdbus-1-dev:armhf
              ;;
          esac

      - name: Configure pkg-config for cross-compile
        # Native aarch64 uses host pkg-config defaults.
        if: startsWith(matrix.target, 'armv7-') || startsWith(matrix.target, 'arm-')
        run: |
          # Point pkg-config exclusively at the installed armhf metadata.
          echo "PKG_CONFIG_PATH=/usr/lib/arm-linux-gnueabihf/pkgconfig" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_SYSROOT_DIR=/" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_ALLOW_CROSS=1" >> "$GITHUB_ENV"

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Isolate host, CPU/RUSTFLAGS, frontend inputs, and placeholder PR builds.
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ github.event_name == 'pull_request' && 'smoke' || 'release' }}-${{ matrix.target }}-${{ matrix.cpu }}-${{ hashFiles('**/Cargo.lock', 'web/src/**', 'web/public/**', 'web/package-lock.json', 'web/package.json', 'web/index.html', 'web/vite.config.*', 'web/tsconfig*.json') }}

      - name: Set up Node.js
        if: github.event_name != 'pull_request'
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      # ARM PR smoke builds embed a placeholder; lint-web builds the real UI.
      - name: Supply placeholder frontend (PR smoke)
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p crates/sentryusb/static
          echo '<!DOCTYPE html><html><body>ci</body></html>' > crates/sentryusb/static/index.html

      - name: Build frontend
        if: github.event_name != 'pull_request'
        run: |
          set -e
          cd web
          npm ci
          npm run build
          cd ..
          # Never package an empty frontend.
          if [ ! -s "web/dist/index.html" ]; then
            echo "::error::web/dist/index.html missing or empty after npm run build"
            exit 1
          fi
          rm -rf crates/sentryusb/static
          cp -r web/dist crates/sentryusb/static
          # Require both the entry point and copied assets.
          if [ ! -s "crates/sentryusb/static/index.html" ] || [ -z "$(ls -A crates/sentryusb/static/assets 2>/dev/null)" ]; then
            echo "::error::crates/sentryusb/static is empty or missing assets after copy"
            exit 1
          fi
          # Pre-compress eligible files over 1 KiB for low-end Pis.
          PRECOMP=0
          while IFS= read -r -d '' f; do
            case "$f" in
              *.br|*.gz|*.woff2|*.png|*.jpg|*.jpeg|*.webp|*.ico|*.gif|*.mp4|*.mp3|*.zip) continue ;;
            esac
            SIZE=$(wc -c < "$f")
            if [ "$SIZE" -lt 1024 ]; then continue; fi
            gzip -9 -k -f "$f"
            brotli -q 11 --keep --force "$f"
            PRECOMP=$((PRECOMP + 1))
          done < <(find crates/sentryusb/static -type f -print0)
          echo "Frontend rebuilt; embedded $(ls crates/sentryusb/static/assets | wc -l) asset(s); pre-compressed $PRECOMP file(s)"

      - name: Validate Cargo.lock
        # Validate the lockfile before the slower build.
        run: cargo fetch --target ${{ matrix.target }}

      - name: Build release binaries (sentryusb + telemetry sampler)
        # RUSTFLAGS tunes each CPU. mold supports native aarch64 here but not
        # Ubuntu 22.04's 32-bit ARM emulation, which retains GNU ld.
        run: |
          if [ -n "${{ matrix.cpu }}" ]; then
              export RUSTFLAGS="-C target-cpu=${{ matrix.cpu }} ${{ matrix.cpu_features }}"
          fi
          case "${{ matrix.target }}" in
            aarch64-*) BUILD_WRAPPER="mold -run" ;;
            *)         BUILD_WRAPPER="" ;;
          esac
          $BUILD_WRAPPER cargo build --release --target ${{ matrix.target }} -p sentryusb
          $BUILD_WRAPPER cargo build --release --target ${{ matrix.target }} -p sentryusb-tesla-telemetry
          # One-shot BLE keep-awake CLI used by run/awake_start.
          $BUILD_WRAPPER cargo build --release --target ${{ matrix.target }} -p sentryusb-tesla-ble --bin sentryusb-ble-action
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.linker }}
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: ${{ matrix.linker }}

      - name: Package binaries
        # PR smoke binaries contain a placeholder and are never packaged.
        if: github.event_name != 'pull_request'
        # Keep the a72 legacy arm64 aliases for pre-matrix updaters. With
        # crypto stripped, that ARMv8.0 build runs on every supported aarch64 Pi.
        run: |
          mkdir -p release
          cp target/${{ matrix.target }}/release/sentryusb release/sentryusb-${{ matrix.artifact_suffix }}
          cp target/${{ matrix.target }}/release/sentryusb-tesla-telemetry release/sentryusb-tesla-telemetry-${{ matrix.artifact_suffix }}
          cp target/${{ matrix.target }}/release/sentryusb-ble-action release/sentryusb-ble-action-${{ matrix.artifact_suffix }}
          if [ "${{ matrix.artifact_suffix }}" = "linux-arm64-a72" ]; then
              cp target/${{ matrix.target }}/release/sentryusb release/sentryusb-linux-arm64
              cp target/${{ matrix.target }}/release/sentryusb-tesla-telemetry release/sentryusb-tesla-telemetry-linux-arm64
              cp target/${{ matrix.target }}/release/sentryusb-ble-action release/sentryusb-ble-action-linux-arm64
          fi
          ls -lh release/

      - name: Upload artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: sentryusb-${{ matrix.artifact_suffix }}-bundle
          path: release/*

  test:
    name: Test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry + build
        # Preserve useful compilation state even when tests fail.
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install bluez build deps
        # bluer/btleplug require libdbus headers through pkg-config.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libdbus-1-dev pkg-config
      - name: Ensure static dir exists
        run: |
          mkdir -p crates/sentryusb/static
          echo '<!DOCTYPE html><html><body>test</body></html>' > crates/sentryusb/static/index.html
      - name: Run tests
        run: cargo test --workspace
      - name: Run installer safety regressions
        run: |
          bash test/install-pi-safety.test.sh
          bash test/sentryusb-pick-binary.test.sh

  lint-web:
    name: Lint web
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Lint
        # Do not increase the reviewed warning budget in eslint.config.js.
        run: |
          cd web
          npm ci
          npx eslint . --max-warnings 30
      - name: Production build
        # Exercise Vite/Rolldown on PRs; release slices cover tags/manual runs.
        if: github.event_name == 'pull_request'
        run: |
          cd web
          npm run build
          if [ ! -s "dist/index.html" ]; then
            echo "::error::web/dist/index.html missing or empty after npm run build"
            exit 1
          fi
      - name: Icons up to date
        # Verify generated icons against symbols.mjs; generation uses jsDelivr.
        run: |
          cd web
          npm run icons -- --check

  release:
    name: Create Release
    needs: [build, test, lint-web]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download all binaries
        uses: actions/download-artifact@v8
        with:
          path: release/
          merge-multiple: true

      - name: List release files
        run: ls -lh release/

      # Preserve an existing manual pre-release flag; abort unexpected gh errors.
      - name: Read existing pre-release flag
        id: relmeta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if pre=$(gh release view "$GITHUB_REF_NAME" --json isPrerelease --jq .isPrerelease 2>err.txt); then
            echo "prerelease=$pre" >> "$GITHUB_OUTPUT"
          elif grep -qi "not found" err.txt; then
            echo "prerelease=" >> "$GITHUB_OUTPUT"
          else
            cat err.txt >&2
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: release/*
          generate_release_notes: true
          # Respect tag convention, the nominated tag, or an existing manual flag.
          prerelease: ${{ contains(github.ref_name, '-') || vars.SENTRYUSB_PRERELEASE_TAG == github.ref_name || steps.relmeta.outputs.prerelease == 'true' }}
