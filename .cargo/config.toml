# Local cross-build defaults; CI overrides target-cpu for a53/a72/a76 releases.
# BCM2710/2711 lack ARMv8 crypto despite LLVM's a53/a72 defaults, so compiled
# AES/SHA would SIGILL (issue #88). Audit cross-SoC support before adding features.

[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"
rustflags = ["-C", "target-cpu=cortex-a72", "-C", "target-feature=-aes,-sha2"]

[target.armv7-unknown-linux-gnueabihf]
linker = "arm-linux-gnueabihf-gcc"
rustflags = ["-C", "target-cpu=cortex-a7"]
