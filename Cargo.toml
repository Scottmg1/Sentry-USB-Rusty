[workspace]
resolver = "2"
members = [
    "crates/sentryusb",
    "crates/ble_health",
    "crates/config",
    "crates/vehicle_profile",
    "crates/shell",
    "crates/ws",
    "crates/drives",
    "crates/api",
    "crates/notify",
    "crates/usb_gadget",
    "crates/setup",
    "crates/cloud_crypto",
    "crates/cloud_uploader",
    "crates/tesla_telemetry",
    "crates/tesla_ble",
    "crates/disk_reader",
]

[workspace.package]
# PolyForm Noncommercial isn't an SPDX identifier, so reference the file.
# Derived TeslaUSB scripts stay MIT; see NOTICE for the per-file breakdown.
license-file = "LICENSE"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "process", "time", "signal", "sync", "io-util", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Exclude unused wasm/oldtime defaults; retain clock and DriveStore serde support.
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
codegen-units = 1
# No code catches unwinds; abort removes ARM unwind tables and systemd restarts.
panic = "abort"
